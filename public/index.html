<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta id="theme-color" name="theme-color" content="#10151a" />
    <meta name="application-name" content="HerdrBridge" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>HerdrBridge</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <script src="/theme.js?v=36"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/rabbit-outline-32-v33.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/rabbit-outline-v33.svg" />
    <link rel="apple-touch-icon" href="/icons/rabbit-outline-app-180-v35.png" />
    <link rel="stylesheet" href="/styles.css?v=63" />
    <script type="module" src="/app.js?v=61"></script>
  </head>
  <body class="auth-pending">
    <main class="shell">
      <aside id="navigator" class="navigator" aria-label="Herdr 탐색기">
        <div class="navigator-heading">
          <button
            id="sidebar-toggle"
            class="sidebar-toggle"
            type="button"
            aria-controls="navigator-content"
            aria-expanded="true"
            aria-label="사이드바 접기"
            title="사이드바 접기"
          >
            <svg class="sidebar-toggle-mark" aria-hidden="true" viewBox="0 0 64 64" focusable="false">
              <path d="M17 30C12 21 12 6 20 6c7 0 9 13 9 22a13 13 0 0 1 6 0c0-9 2-22 9-22 8 0 8 15 3 24 7 5 8 14 4 21-4 6-11 8-19 8s-15-2-19-8c-4-7-3-16 4-21Z" />
            </svg>
          </button>
          <div class="navigator-heading-actions">
            <button
              id="create-project"
              class="icon-button navigator-create-project"
              type="button"
              aria-label="새 프로젝트 만들기"
              title="새 프로젝트 만들기"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path d="M12 5v14M5 12h14" />
              </svg>
            </button>
          </div>
        </div>

        <div id="navigator-content" class="navigator-content">
          <nav id="workspace-list" aria-label="워크스페이스, 탭 및 패인"></nav>
        </div>

        <div class="navigator-footer">
          <button
            id="theme-toggle"
            class="ghost-button theme-button"
            type="button"
            aria-label="라이트 모드로 전환"
            title="라이트 모드로 전환"
          >
            <svg class="theme-icon theme-icon-light" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <circle cx="12" cy="12" r="3.5" />
              <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="theme-icon theme-icon-dark" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z" />
            </svg>
          </button>
          <div class="navigator-footer-actions">
            <div id="connection-status" class="connection" role="status" aria-live="polite" aria-label="연결 중" title="연결 중">
              <span id="connection-dot" class="connection-dot"></span>
            </div>
          </div>
        </div>
      </aside>
      <button id="sidebar-scrim" class="sidebar-scrim" type="button" aria-label="사이드바 닫기"></button>

      <section class="terminal-panel" aria-label="선택한 패인">
        <div class="terminal-heading">
          <button
            id="mobile-sidebar-open"
            class="icon-button mobile-sidebar-open"
            type="button"
            aria-controls="navigator"
            aria-expanded="false"
            aria-label="사이드바 열기"
            title="사이드바 열기"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M5 7h14M5 12h14M5 17h14" />
            </svg>
          </button>
          <div class="pane-heading-copy">
            <span id="pane-context">패인을 선택하세요</span>
            <span class="pane-heading-separator" aria-hidden="true">·</span>
            <h2 id="pane-title">터미널</h2>
          </div>
          <div class="terminal-heading-actions">
            <span id="pane-state" class="state-pill state-unknown" aria-label="상태: unknown" title="unknown">·</span>
          </div>
        </div>

        <div class="terminal-stage">
          <div id="history-status" class="history-status" role="status" aria-live="polite"></div>
          <pre id="terminal-output" tabindex="0" aria-label="터미널 출력">워크스페이스를 불러오는 중입니다…</pre>
        </div>

        <div class="quick-keys" aria-label="특수 키">
          <button type="button" data-key="esc">Esc</button>
          <button type="button" data-key="ctrl+c">Ctrl+C</button>
          <button type="button" data-key="tab">Tab</button>
          <button type="button" data-key="shift+tab">Shift+Tab</button>
          <button type="button" data-key="up">↑</button>
          <button type="button" data-key="down">↓</button>
          <button type="button" data-key="left">←</button>
          <button type="button" data-key="right">→</button>
          <button type="button" data-key="enter">Enter</button>
        </div>

        <form id="input-form" class="input-form">
          <span id="action-feedback" role="status" aria-live="polite"></span>
          <div class="input-composer">
            <textarea
              id="terminal-input"
              aria-label="패인에 텍스트 보내기"
              maxlength="8000"
              rows="3"
            ></textarea>
            <button class="primary-button send-button" type="submit" aria-label="전송" title="전송">
              <svg aria-hidden="true" viewBox="0 0 20 20" focusable="false">
                <path d="M10 16V4m0 0L5.5 8.5M10 4l4.5 4.5" />
              </svg>
            </button>
          </div>
        </form>
      </section>
    </main>

    <section id="login-screen" class="login-screen" aria-labelledby="login-title" hidden>
      <form id="login-form" class="login-card">
        <svg class="login-mark" aria-hidden="true" viewBox="0 0 64 64" focusable="false">
          <path d="M17 30C12 21 12 6 20 6c7 0 9 13 9 22a13 13 0 0 1 6 0c0-9 2-22 9-22 8 0 8 15 3 24 7 5 8 14 4 21-4 6-11 8-19 8s-15-2-19-8c-4-7-3-16 4-21Z" />
        </svg>
        <div class="login-heading">
          <h1 id="login-title">HerdrBridge</h1>
          <p>비밀번호를 입력하세요.</p>
        </div>
        <label class="visually-hidden" for="login-password">비밀번호</label>
        <input
          id="login-password"
          name="password"
          type="password"
          maxlength="256"
          autocomplete="current-password"
          required
        />
        <p id="login-feedback" class="login-feedback" role="status" aria-live="polite"></p>
        <button class="primary-button login-submit" type="submit">연결</button>
      </form>
    </section>

    <dialog id="project-dialog" class="app-dialog" aria-labelledby="project-dialog-title">
      <form id="project-create-form" class="dialog-form">
        <div class="dialog-heading">
          <h2 id="project-dialog-title">새 프로젝트</h2>
          <p id="project-session-context">기본 셸로 시작합니다.</p>
        </div>
        <label for="project-name">프로젝트 이름</label>
        <input id="project-name" name="label" type="text" maxlength="120" required />
        <p id="project-dialog-feedback" class="dialog-feedback" role="status" aria-live="polite"></p>
        <div class="dialog-actions">
          <button id="project-dialog-cancel" class="secondary-button" type="button">취소</button>
          <button class="primary-button" type="submit">만들기</button>
        </div>
      </form>
    </dialog>

  </body>
</html>
